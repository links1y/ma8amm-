<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maram - Official Links</title>
    <!-- Font Cyber / ICS Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: #fff0f6;
            color: #4a154b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Cute Grid Background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 105, 180, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 105, 180, 0.15) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: 0;
            animation: moveGrid 15s linear infinite;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 35px 35px; }
        }

        /* Soft Pink Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 0;
            animation: floatOrb 8s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: #ffb7d5;
            top: -60px;
            left: -60px;
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            background: #ffd1e8;
            bottom: -60px;
            right: -60px;
            animation-delay: -4s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.15); }
        }

        .container {
            width: 100%;
            max-width: 410px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* White & Pink Glass Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid rgba(255, 105, 180, 0.3);
            border-radius: 35px;
            padding: 35px 25px 30px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2), 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 22px;
        }

        /* Pink Cute RGB Border */
        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #ff85c0, #ffc0cb, #ff0055);
            animation: rotateBorder 3s linear infinite;
            z-index: 1;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            z-index: 2;
        }

        /* Cute Live Badge */
        .live-tag {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 20px;
            letter-spacing: 2px;
            z-index: 3;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
            animation: pulse 1.6s infinite;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.06); }
            100% { transform: translateX(-50%) scale(1); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            color: #8a4b76;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 6px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(255, 182, 193, 0.6);
            border-radius: 22px;
            color: #4a154b;
            text-decoration: none;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2);
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: 0.5s;
        }

        .link-card:hover::after {
            left: 100%;
        }

        .icon-wrapper {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff0f6;
            transition: transform 0.3s ease;
        }

        .icon-wrapper svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .link-info {
            flex: 1;
            text-align: left;
            margin-left: 15px;
        }

        .link-title {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #2b082c;
        }

        .link-desc {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #a05a8d;
            margin-top: 2px;
        }

        .chevron {
            width: 16px;
            height: 16px;
            fill: #c982b5;
            transition: transform 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-4px);
            background: #ffffff;
            border-color: #ff69b4;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.25);
        }

        .link-card:hover .chevron {
            transform: translateX(4px);
            fill: #ff1493;
        }

        /* Specific Link Colors */
        .link-tiktok .icon-wrapper { color: #000000; background: #f0f0f0; }
        .link-instagram .icon-wrapper { color: #E1306C; background: #ffe6f0; }
        .link-discord .icon-wrapper { color: #5865F2; background: #eef0ff; }
        .link-ba9chich .icon-wrapper { color: #ff8c00; background: #fff5e6; }
        .link-kick .icon-wrapper { color: #00b300; background: #e6ffe6; }

        /* Floating Indicator */
        .music-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffffff;
            border: 2px solid #ffb6c1;
            border-radius: 50px;
            padding: 8px 18px 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
            z-index: 100;
        }

        .music-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            animation: spin 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .music-icon svg { width: 14px; height: 14px; fill: #ffffff; }

        .music-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 800;
            color: #ff1493;
            letter-spacing: 0.5px;
        }
    </style>
</head>

    <script>
        const audio = document.getElementById('bgMusic');

        window.addEventListener('DOMContentLoaded', () => {
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    const forcePlay = () => {
                        audio.play();
                        document.removeEventListener('mousemove', forcePlay);
                        document.removeEventListener('touchstart', forcePlay);
                        document.removeEventListener('click', forcePlay);
                        document.removeEventListener('scroll', forcePlay);
                    };
                    document.addEventListener('mousemove', forcePlay);
                    document.addEventListener('touchstart', forcePlay);
                    document.addEventListener('click', forcePlay);
                    document.addEventListener('scroll', forcePlay);
                });
            }
        });
    </script>
